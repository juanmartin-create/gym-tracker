<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>THRST — Training Log</title>
  <meta name="description" content="Registro de entrenamiento: prescripción, progresión y volumen. Local-first, offline." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0a" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="THRST" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <div id="rest-bar" class="rest-bar" hidden>
    <div class="rest-inner">
      <div class="rest-label">DESCANSO</div>
      <div class="rest-time" id="rest-time">00:00</div>
      <div class="rest-actions">
        <button data-rest="-15" aria-label="menos 15s">−15</button>
        <button data-rest="+15" aria-label="mas 15s">+15</button>
        <button data-rest="skip" aria-label="omitir">SKIP</button>
      </div>
    </div>
  </div>

  <nav id="tabbar" class="tabbar" hidden>
    <button class="tab" data-route="hoy" aria-label="Entrenar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M4 8l-1 1m17 6l1-1M8 4L7 3m9 17l1 1M9 9l6 6M7.5 5.5l-2 2m13 9l-2 2"/></svg>
      <span>Train</span>
    </button>
    <button class="tab" data-route="rutinas" aria-label="Rutinas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span>Program</span>
    </button>
    <button class="tab" data-route="stats" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4m0 16h16M8 16l3-4 3 3 5-7"/></svg>
      <span>Dash</span>
    </button>
    <button class="tab" data-route="food" aria-label="Alimentacion">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m0 0a4 4 0 004-4V3M12 12a4 4 0 01-4-4V3m10 4v14M4 3h1v6a3 3 0 003 3"/></svg>
      <span>Food</span>
    </button>
    <button class="tab" data-route="historial" aria-label="Historial">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-9 9zm0 0H1m11-5v5l3 3"/></svg>
      <span>Log</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
